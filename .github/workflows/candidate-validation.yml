name: Private candidate validation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit candidate version (no SNAPSHOT)
        default: 0.1.0-rc.1
        required: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: corretto
          java-version: '25'
      - name: Prepare existing Maven version
        shell: pwsh
        run: ./scripts/setup-maven.ps1
      - name: Build and verify private candidate
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-candidate.ps1 -Version "$env:CANDIDATE_VERSION" -BuildTool mvn
          exit $LASTEXITCODE
      # No upload, release, tag or Marketplace publication. Authorization is separate.
